<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7a5a16">
<title>A Message from CFWBC Youths</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:Georgia,"Times New Roman",serif;
  background:radial-gradient(circle at top,#fffdf5 0%,#f5ead0 48%,#d7bd80 100%);
  color:#342813; overflow:hidden;
}
.card{
  width:min(92%,520px); padding:42px 28px; text-align:center;
  background:rgba(255,255,255,.94); border:2px solid #b88a2b;
  border-radius:28px; box-shadow:0 18px 55px rgba(64,43,10,.25);
  position:relative;
}
.cross{font-size:58px; color:#9a711c; line-height:1; margin-bottom:12px}
.small{letter-spacing:3px; text-transform:uppercase; font:600 13px Arial,sans-serif;color:#8a681d}
h1{font-size:31px; line-height:1.35; margin:24px 0 20px; color:#3c2c12}
.divider{width:90px;height:2px;background:#b88a2b;margin:0 auto 25px}
.message{font-size:24px;line-height:1.55;font-weight:bold}
.thanks{margin-top:28px;font:600 15px Arial,sans-serif;letter-spacing:1.5px;color:#80601d}
.verse{margin-top:25px;font-size:14px;font-style:italic;color:#6f5a32}
.corner{position:absolute;width:28px;height:28px;border-color:#b88a2b;border-style:solid}
.tl{top:14px;left:14px;border-width:2px 0 0 2px;border-radius:10px 0 0 0}
.tr{top:14px;right:14px;border-width:2px 2px 0 0;border-radius:0 10px 0 0}
.bl{bottom:14px;left:14px;border-width:0 0 2px 2px;border-radius:0 0 0 10px}
.br{bottom:14px;right:14px;border-width:0 2px 2px 0;border-radius:0 0 10px 0}
@media(max-width:380px){h1{font-size:27px}.message{font-size:21px}.card{padding:36px 20px}}
</style>
</head>
<body>
<main class="card">
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>
  <div class="cross">✝</div>
  <div class="small">WELCOME TO</div>
  <h1>ANNUAL YOUTH CONFERENCE 2K26</h1>
  <div class="small">THEME</div>
  <div class="message" style="margin-top:10px;">RUN TOWARDS THE GOAL</div>
  <div class="divider"></div>
  <div class="message">THE ONLY CONNECTION YOU NEED TO BE WITH JESUS</div>
  <div class="thanks">THANKS, CFWBC YOUTHS ❤️</div>
  <div class="verse">“I am the way, the truth, and the life.” — John 14:6</div>
</main>
</body>
</html>
